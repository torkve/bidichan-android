name: build

# Push to main -> a signed APK as a build artifact. Tag v* -> the same APK
# attached to a GitHub release. Manual dispatch -> whichever you pick.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the APK to a release
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Job-level so the signing step's `if:` can see it — the secrets context
      # is not available there, and a step's own env is not either.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/bidichan-src/go.mod
          cache-dependency-path: vendor/bidichan-src/go.sum

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          # gomobile needs an NDK to cross-compile the Go core for each ABI.
          sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
        env:
          NDK_VERSION: 27.2.12479018

      - name: Build the bidichan binding (gomobile)
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd vendor/bidichan-src
          # gomobile needs x/mobile as a module dependency; add it CI-locally so
          # the pinned core never carries a build-only dependency.
          go get golang.org/x/mobile/bind@latest
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -target=android -androidapi 26 \
            -javapkg=torkve.bidichan.go -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/libs/bidichan.aar" ./mobile
          ls -la "$GITHUB_WORKSPACE/app/libs"

      - name: Materialise the signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Say how the build will be signed
        run: |
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            echo "Release key: signing with the keystore from KEYSTORE_BASE64."
          else
            echo "::warning::No signing secrets set — this APK is DEBUG-SIGNED."
            echo "Installable for testing, but never publish it. See SETUP.md."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Run the unit tests
        # Before assembling, so a broken build does not produce an APK. Only
        # the JVM tests run here — anything needing a device cannot run on this
        # runner, which is why what is testable this way is kept that way.
        #
        # testDebugUnitTest, not testReleaseUnitTest: AGP 9 registers a unit
        # test component for the debug variant only, and naming a task that
        # does not exist fails the build rather than quietly running nothing.
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the artifact
        id: apk
        run: |
          set -euo pipefail
          path=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=bidichan-${GITHUB_REF_NAME//\//-}-${BUILD_NUMBER}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
